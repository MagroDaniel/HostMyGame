<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host My Game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Cpath d='M9 11h14v10H9z' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='13' cy='16' r='1.6' fill='white'/%3E%3Ccircle cx='19' cy='16' r='1.6' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="login-box">
      <div class="login-brand"><span class="brand-mark"></span>Host My Game</div>
      <form id="loginForm" class="login-card">
        <h1 id="loginTitle">Entrar</h1>
        <p id="loginHint" class="muted" hidden>Primeiro acesso: crie a conta de administrador do painel.</p>
        <label>Usuário <input name="username" autocomplete="username" required></label>
        <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
        <label id="codeRow" hidden>Código do autenticador (ou de recuperação) <input name="code" autocomplete="one-time-code" maxlength="9" spellcheck="false"></label>
        <button class="primary" type="submit">Continuar</button>
      </form>
    </div>
  </section>

  <div id="app" hidden>
    <header class="navbar">
      <div class="nav-inner">
        <a href="#/" class="brand"><span class="brand-mark"></span><span>Host My Game</span></a>
        <nav class="nav-links" id="navLinks"></nav>
        <div class="nav-right">
          <button class="nav-btn" id="searchBtn" title="Buscar (Ctrl+K)" aria-label="Buscar"></button>
          <div class="user-menu">
            <button class="nav-btn avatar-btn" id="userBtn" aria-haspopup="true" aria-expanded="false"><span class="avatar" id="avatar"></span></button>
            <div class="dropdown" id="userDropdown" hidden>
              <div class="dropdown-head"><strong id="userName"></strong><span class="muted small" id="userRole"></span></div>
              <a href="#/account" data-icon="user">Minha conta</a>
              <button id="logoutBtn" data-icon="logout">Sair</button>
              <div class="dropdown-foot muted small" id="versionLabel"></div>
            </div>
          </div>
          <button class="nav-btn mobile-only" id="menuToggle" aria-label="Menu"></button>
        </div>
      </div>
    </header>
    <nav class="subnav" id="subnav" hidden></nav>
    <div class="container">
      <div class="notice" id="panelUpdateNotice" hidden></div>
      <div class="page-head" id="pageHead">
        <h1 id="pageTitle"></h1>
        <div class="page-actions" id="pageActions"></div>
      </div>
      <main id="main"></main>
    </div>
    <footer class="footer muted small">Host My Game <span id="footVersion"></span></footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/js/main.js" type="module"></script>
</body>
</html>
